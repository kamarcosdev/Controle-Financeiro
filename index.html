<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
</head>
<body>
    <section id="resumo-financeiro">

         <h2>Resumo Financeiro</h2>
        
         <div class="cards-resumo">

            <div class="card">
                <h3>Saldo</h3>
                <p>R$ 0,00</p>
            </div>

            <div class="card">
                <h3>Receitas</h3>
                <p>R$ 0,00</p>
            </div>

            <div class="card">
                <h3>Despesas</h3>
                <p>R$ 0,00</p>
            </div>

         </div>

    </section>

    <section id="nova-movimentacao">

        <h2>Nova Movimentação</h2>
        
        <form id="form-movimentacao">
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" name="descricao" required>

            <label for="valor">Valor:</label>
            <input type="number" id="valor" name="valor" step="0.01" required>

            <label for="tipo">Tipo:</label>
            <select id="tipo" name="tipo" required>
                <option value="">Selecione</option>
                <option value="receita">Receita</option>
                <option value="despesa">Despesa</option>
            </select>

            <label for="data">Data:</label>
            <input type="date" id="data" name="data" required>

            <button type="submit">Adicionar Movimentação</button>

        </form>
            
    </section>

    <section id="historico-movimentacoes">

        <h2>Histórico de Movimentações</h2>

        <table>
            <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Tipo</th>
                    <th>Data</th>
                </tr>
            </thead>
            <tbody id="tabela-movimentacoes">
                <!-- As movimentações serão adicionadas aqui dinamicamente -->
                 <tr>
                    <td>Mercado</td>
                    <td>R$ 100,00</td>
                    <td>Despesa</td>
                    <td>2023-10-01</td>
                 </tr>
            </tbody>
        </table>
    </section>
    
        
    
</body>
</html>
